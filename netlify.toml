[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Route all /api calls directly to the Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Single Page App fallback routing for React
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
