[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Public build configuration (Secrets are loaded securely from Netlify Environment Variables)
[build.environment]
  NODE_VERSION = "20"
  VITE_FIREBASE_AUTH_DOMAIN = "sunstone-library-cbf2d.firebaseapp.com"
  VITE_FIREBASE_DATABASE_URL = "https://sunstone-library-cbf2d-default-rtdb.asia-southeast1.firebasedatabase.app/"
  VITE_FIREBASE_PROJECT_ID = "sunstone-library-cbf2d"
  VITE_FIREBASE_STORAGE_BUCKET = "sunstone-library-cbf2d.appspot.com"

# Route all /api calls directly to the Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Single Page App fallback routing for React
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
